name: Enterprise Security CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-security:
    name: Backend SAST & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit Static Analysis (SAST)
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Pip Audit (Dependency Vulnerabilities)
        run: |
          pip-audit -r backend/requirements.txt || true

      - name: Run Enterprise Security Test Suite
        env:
          JWT_SECRET_KEY: test_pipeline_secret_key_at_least_32_characters_long
          APPROVAL_SECRET_KEY: test_pipeline_approval_secret_at_least_32_chars
        run: |
          python -m pytest backend/tests/test_security.py -v

  frontend-security:
    name: Frontend Dependency & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || true

  container-scan:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Container
        run: |
          docker build -t revive-backend:security-scan ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'revive-backend:security-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
